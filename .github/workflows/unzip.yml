name: Unzip Starter Pack
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP and Commit Files
        run: |
          for z in *.zip; do
            unzip -o "$z"
            rm -f "$z"
          done
          rm -f .github/workflows/unzip.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Episode III HD-2D starter pack"
          git push
